name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild from source
        run: python3 build.py

      - name: Fail if dist/ or docs/ is out of date
        run: |
          if ! git diff --quiet -- dist docs/index.html; then
            echo "::error::dist/flow_workbench.html or docs/index.html is stale. Run 'python3 build.py' and commit the result."
            git diff --stat -- dist docs/index.html
            exit 1
          fi

      - name: Unit tests
        run: node tests/core.test.js

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: End-to-end tests
        run: python3 tests/e2e.py

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: flow-workbench
          path: dist/flow_workbench.html
